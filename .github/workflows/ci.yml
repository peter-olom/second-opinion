name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build

  # The full suite relies on POSIX shells, permissions and symlinks. On Windows,
  # check that everything builds and run the Windows path-resolution tests
  # natively, plus the rename logic used to move a running so.exe aside (these
  # rename an ordinary file; they do not start a real so.exe).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./cmd/so
      - name: Windows-specific tests
        shell: bash
        run: |
          go test ./cmd/so -count=1 -v -run "TestResolveConfigPathKeepsDriveRoot|TestResolveConfigPathRootedWithoutDrive|TestUninstallMovesRunningBinaryAsideOnWindows|TestUninstallNeverOverwritesOldBinaryOnWindows|TestUninstallOnWindowsRemovesOnlyTheLink" | tee test.log
          passed=$(grep -c '^--- PASS' test.log)
          echo "passed: $passed"
          # Fail if a rename or typo made the filter match fewer tests.
          [ "$passed" -eq 5 ]

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          install-only: true
      - run: make snapshot
